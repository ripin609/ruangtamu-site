<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruang Tamu — Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F1E8;
    --panel:#FFFFFF;
    --panel-line:#E1D7BE;
    --gold:#A9700F;
    --gold-soft:#C9A227;
    --gold-wash:rgba(169,112,15,0.08);
    --ink:#2A2318;
    --muted:#8B8069;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-weight:300;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  /* ---------- HEADER ---------- */
  header{
    min-height:56svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:7vh 6vw 6vh;
    background:
      radial-gradient(circle at 50% 0%, var(--gold-wash), transparent 60%),
      var(--bg);
  }
  .logo{
    width:min(280px, 60vw);
    height:auto;
    opacity:0;
    animation:riseIn 0.9s ease forwards;
    animation-delay:0.05s;
  }
  .eyebrow{
    font-family:'Space Mono',monospace;
    font-size:0.72rem;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--gold);
    margin-top:1.8rem;
    opacity:0;
    animation:riseIn 0.9s ease forwards;
    animation-delay:0.22s;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:400;
    font-optical-sizing:auto;
    font-size:clamp(2.2rem, 5.8vw, 4.2rem);
    line-height:1.08;
    letter-spacing:-0.01em;
    margin-top:2rem;
    color:var(--ink);
    opacity:0;
    animation:riseIn 1s ease forwards;
    animation-delay:0.36s;
  }
  h1 em{
    font-style:italic;
    font-weight:300;
    color:var(--gold);
  }
  .header-rule{
    width:64px;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold-soft), transparent);
    margin:1.7rem 0;
    opacity:0;
    animation:riseIn 1s ease forwards;
    animation-delay:0.52s;
  }
  .subline{
    font-family:'Inter',sans-serif;
    font-weight:300;
    font-size:1rem;
    color:var(--muted);
    max-width:42ch;
    opacity:0;
    animation:riseIn 1s ease forwards;
    animation-delay:0.64s;
  }
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ---------- EVENTS INDEX ---------- */
  main{
    max-width:1180px;
    margin:0 auto;
    padding:2vh 6vw 10vh;
  }
  .index-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:1rem;
    margin-bottom:2.4rem;
    border-bottom:1px solid var(--panel-line);
    padding-bottom:1.4rem;
  }
  .index-head h2{
    font-family:'Fraunces',serif;
    font-weight:400;
    font-size:clamp(1.4rem,3vw,1.9rem);
    color:var(--ink);
  }
  .index-head span{
    font-family:'Space Mono',monospace;
    font-size:0.68rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .tiles{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px,1fr));
    gap:26px;
  }

  .tile{
    display:block;
    text-decoration:none;
    color:inherit;
    background:var(--panel);
    border:1px solid var(--panel-line);
    overflow:hidden;
    position:relative;
    transition:border-color 0.4s ease, transform 0.4s ease, box-shadow 0.4s ease;
  }
  .tile:hover, .tile:focus-visible{
    border-color:var(--gold-soft);
    transform:translateY(-4px);
    box-shadow:0 18px 34px -18px rgba(169,112,15,0.28);
    outline:none;
  }
  .tile:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }

  .tile-media{
    aspect-ratio:4/3;
    position:relative;
    overflow:hidden;
    background:
      linear-gradient(160deg, var(--gold-wash), transparent 60%),
      #EFE9D9;
  }
  .tile-media img{
    width:100%; height:100%; object-fit:cover; display:block;
    transition:transform 0.7s ease;
  }
  .tile:hover .tile-media img{ transform:scale(1.045); }
  .tile-media .ph{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Mono',monospace;
    font-size:0.66rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--muted);
    text-align:center;
    padding:1rem;
  }
  .tile-status{
    position:absolute;
    top:12px; left:12px;
    font-family:'Space Mono',monospace;
    font-size:0.6rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--gold);
    background:rgba(255,255,255,0.88);
    border:1px solid var(--gold-soft);
    padding:4px 9px;
  }

  .tile-body{
    padding:1.4rem 1.5rem 1.6rem;
  }
  .tile-date{
    font-family:'Space Mono',monospace;
    font-size:0.68rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:0.6rem;
  }
  .tile-title{
    font-family:'Fraunces',serif;
    font-weight:400;
    font-size:1.3rem;
    line-height:1.3;
    margin-bottom:0.5rem;
    color:var(--ink);
  }
  .tile-venue{
    font-family:'Inter',sans-serif;
    font-weight:300;
    font-size:0.86rem;
    color:var(--muted);
  }
  .tile-arrow{
    margin-top:1rem;
    font-family:'Inter',sans-serif;
    font-size:0.78rem;
    letter-spacing:0.05em;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .tile-arrow span{
    transition:transform 0.35s ease;
    display:inline-block;
    color:var(--gold);
  }
  .tile:hover .tile-arrow span{ transform:translateX(4px); }

  .empty-note{
    font-family:'Space Mono',monospace;
    font-size:0.75rem;
    color:var(--muted);
    letter-spacing:0.04em;
    padding:2rem 0;
  }

  /* ---------- FOOTER ---------- */
  footer{
    text-align:center;
    padding:6vh 6vw 7vh;
    border-top:1px solid var(--panel-line);
  }
  footer p{
    font-family:'Space Mono',monospace;
    font-size:0.7rem;
    letter-spacing:0.1em;
    color:var(--muted);
  }
  footer .mark{
    color:var(--gold);
    margin-top:0.5rem;
  }
</style>
</head>

    <h1>Every Gathering, <em>Remembered</em></h1>
    <div class="header-rule"></div>
    <div class="subline">A running record of the sessions, meetups, and afternoons hosted at Ruang Tamu. Pick an event to open its full album.</div>
  </header>

  <main>
    <div class="index-head">
      <h2>Events</h2>
      <span id="eventCount">— events</span>
    </div>
    <div class="tiles" id="tiles"></div>
  </main>

  <footer>
    <p>Thank you for spending your time with us.</p>
    <p class="mark">RUANGTAMU.ONLINE</p>
  </footer>

<script>
  /* ---------------------------------------------------------
     ADD NEW EVENTS HERE.
     Each entry becomes one tile. To add a future event, copy
     an object below, edit the fields, and add it to the array.

     - title:   event name shown on the tile
     - date:    short date label, e.g. "JUL 2026"
     - venue:   location line
     - status:  small tag on the image, e.g. "NEW" or "" to hide
     - photoUrl: the Google Photos share link for this event's album
     - image:   (optional) a cover photo URL. Leave "" for a
                placeholder tile until you add a real photo.
  --------------------------------------------------------- */
  const EVENTS = [
    {
      title: "Pickleball Afternoon",
      date: "JULY 2026",
      venue: "Ruang Tamu Court",
      status: "NEW",
      photoUrl: "https://photos.app.goo.gl/kf2Htgkm7DmiVq3t6",   // <-- paste this event's Google Photos share link here
      image: "pickleballcover.jpg"       // <-- optional cover photo URL
    }
    // ,{
    //   title: "Next Event Name",
    //   date: "MONTH YEAR",
    //   venue: "Venue name",
    //   status: "",
    //   photoUrl: "",
    //   image: ""
    // }
  ];

  const tilesEl = document.getElementById('tiles');
  const countEl = document.getElementById('eventCount');

  if(EVENTS.length === 0){
    tilesEl.innerHTML = '<div class="empty-note">No events listed yet. Add one inside the EVENTS array in the page\'s script.</div>';
  } else {
    countEl.textContent = EVENTS.length + (EVENTS.length === 1 ? ' EVENT' : ' EVENTS');

    EVENTS.forEach(function(ev){
      const hasLink = !!ev.photoUrl;
      const tile = document.createElement(hasLink ? 'a' : 'div');
      tile.className = 'tile';
      if(hasLink){
        tile.href = ev.photoUrl;
        tile.target = '_blank';
        tile.rel = 'noopener';
      }

      const mediaInner = ev.image
        ? '<img src="' + ev.image + '" alt="' + ev.title + '">'
        : '<div class="ph">Cover photo<br>not added yet</div>';

      tile.innerHTML =
        '<div class="tile-media">' +
          (ev.status ? '<div class="tile-status">' + ev.status + '</div>' : '') +
          mediaInner +
        '</div>' +
        '<div class="tile-body">' +
          '<div class="tile-date">' + ev.date + '</div>' +
          '<div class="tile-title">' + ev.title + '</div>' +
          '<div class="tile-venue">' + ev.venue + '</div>' +
          '<div class="tile-arrow">' + (hasLink ? 'View album <span>&rarr;</span>' : 'Album link not added yet') + '</div>' +
        '</div>';

      tilesEl.appendChild(tile);
    });
  }
</script>
